[namelist:formulation]
solver_moisture_conservation=.true.

[namelist:radiation]
!!n_inc_radstep=2
n_radstep=6

[namelist:timestepping]
inner_iterations_bdf2=1,1
!!inner_iterations_si=2,2
inner_iterations_tr=2,1
method='tr_bdf2'
!!tau_r=1.0
!!tau_t=1.0
!!tau_u=0.55
tr_bdf2_bdf_evap_condense=.false.
tr_bdf2_cheap_transport=.true.
tr_bdf2_first_guess='extrapolation'
tr_bdf2_tr_physics=.false.

[namelist:transport]
dep_pt_stencil_extent=10
