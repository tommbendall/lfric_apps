[namelist:formulation]
use_multires_coupling=.true.

# The physics increments are smoothed on the coarse mesh of the multigrid
# chain, so this needs a resolution with a multigrid (e.g. C48_MG)
[namelist:multires_coupling]
aerosol_mesh_name='dynamics'
lowest_order_aero_flag=.false.
multires_coupling_mesh_tags='dynamics','multigrid_l2'
orography_mesh_name='dynamics'
physics_mesh_name='multigrid_l2'

[namelist:timestepping]
inner_iterations_bdf2=1,1
!!inner_iterations_si=2,2
inner_iterations_tr=2,1
method='tr_bdf2'
!!si_mphys_transport_interleave=.false.
!!si_mphys_transport_substeps=1
!!tau_r=1.0
!!tau_t=1.0
!!tau_u=0.55
tr_bdf2_bdf_cloud_balance=.false.
tr_bdf2_bdf_evap_condense=.false.
tr_bdf2_bdf_physics=.false.
tr_bdf2_first_guess='extrapolation'
tr_bdf2_tr_physics=.true.
tr_bdf2_transport='cheap'
