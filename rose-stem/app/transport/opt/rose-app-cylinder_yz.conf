[env]
XIOS_SERVER_MODE=True
XIOS_SERVER_RANKS=1

[namelist:extrusion]
domain_height=2000.0
number_of_layers=100

[namelist:idealised]
test='vertical_cylinder'

[namelist:initial_density]
density_background=2.0
density_max=5.0

[namelist:initial_tracer_field]
field_background=2.0
field_max=5.0

[namelist:initial_wind]
profile='rotational_yz'
sbr_angle_lat=0.0
u0=1.0

[namelist:io]
diagnostic_frequency=125
!!nodal_output_on_w3=
use_xios_io=.true.
write_conservation_diag=.true.

[namelist:transport]
enforce_min_value=.false.,.false.,.true.,.false.,.false.,.true.,.false.
equation_form=1,2,1,2,1,3,2
field_names='rho','theta','tracer_con','tracer_adv','constant','mr',
           ='w2_vector'
horizontal_method=7*2
horizontal_monotone=1,5,5,1,5,5,1
log_space=.true.,.true.,.false.,.false.,.false.,.false.,.false.
min_value=7*0.0
profile_size=7
reversible=.true.,.true.,.true.,.false.,.true.,.true.,.false.
scheme=7*3
splitting=7*2
vertical_method=7*2
vertical_monotone=1,5,5,1,5,5,1
vertical_monotone_order=7*3
