[namelist:formulation]
use_multires_coupling=.true.

# The physics increments are smoothed on a coarser mesh from the chain of
# meshes in the BiP200x10-100x100 mesh file
[namelist:multires_coupling]
aerosol_mesh_name='dynamics'
coarse_rad_aerosol=.false.
lowest_order_aero_flag=.false.
multires_coupling_mesh_tags='dynamics','multigrid_l1'
orography_mesh_name='dynamics'
physics_mesh_name='multigrid_l1'
recovery_order='linear'

[namelist:timestepping]
method='tr_bdf2'
tr_bdf2_tr_physics=.true.
